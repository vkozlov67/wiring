    location = /.well-known/apple-app-site-association {
        include /etc/nginx/snippets/wiring-rust-public.conf;
    }
    location = /.well-known/assetlinks.json {
        include /etc/nginx/snippets/wiring-rust-public.conf;
    }

    location ~ ^/(account-deletion|child-safety|privacy|legal|rules|marketing|glossary|robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/snippets/wiring-rust-public.conf;
    }
