# Form submissions and requests with mobile authorization retain Flask's support policy.
location = /support {
    set $wiring_support_backend 127.0.0.1:5082;
    if ($request_method = GET) { set $wiring_support_backend 127.0.0.1:5082; }
    if ($request_method = HEAD) { set $wiring_support_backend 127.0.0.1:5082; }
    if ($http_authorization ~* "^Bearer ") { set $wiring_support_backend 127.0.0.1:5082; }
    include /etc/nginx/snippets/wiring-rust-support-shell-backend*.conf;
    proxy_pass http://$wiring_support_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
