location = /api/auth/providers {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /api/auth/native/browser {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location ~ ^/api/auth/[^/]+/start$ {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
