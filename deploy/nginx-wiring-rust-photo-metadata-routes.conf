location = /api/photos/order {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location ~ ^/api/photos/[0-9]+$ {
    set $wiring_photo_backend 127.0.0.1:5082;
    if ($request_method = PATCH) { set $wiring_photo_backend 127.0.0.1:5082; }
    include /etc/nginx/snippets/wiring-rust-photo-method-*.conf;
    proxy_pass http://$wiring_photo_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
