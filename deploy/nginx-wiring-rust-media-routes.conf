location ~ ^/api/messages/media/[0-9]+$ {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location ^~ /media/ {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location ^~ /_wiring_private_uploads/ {
    internal;
    alias /var/lib/wiring/uploads/;
    disable_symlinks on from=/var/lib/wiring/uploads/;
    add_header Cache-Control "private, max-age=86400";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location ^~ /_wiring_private_thumbs/ {
    internal;
    alias /var/lib/wiring/rust-media-cache/;
    disable_symlinks on from=/var/lib/wiring/rust-media-cache/;
    add_header Cache-Control "private, max-age=86400";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location ^~ /_wiring_uploads/ {
    internal;
    alias /var/lib/wiring/uploads/;
    disable_symlinks on from=/var/lib/wiring/uploads/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location ^~ /_wiring_thumbs/ {
    internal;
    alias /var/lib/wiring/rust-media-cache/;
    disable_symlinks on from=/var/lib/wiring/rust-media-cache/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location ^~ /_wiring_static_files/ {
    internal;
    alias /var/www/wiring-static/;
    disable_symlinks on from=/var/www/wiring-static/;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
