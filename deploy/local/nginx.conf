map $arg_s $wiring_thumbnail {
    default 0;
    sm 1;
}

server {
    listen 80;
    client_max_body_size 12m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    location / { proxy_pass http://rust:5082; }
    location = /public/manifest.webmanifest { proxy_pass http://rust:5082; }

    location = /sw.js {
        alias /var/www/wiring-static/sw.js;
        add_header Service-Worker-Allowed /;
        add_header Cache-Control no-cache;
    }

    location ^~ /public/ {
        if ($wiring_thumbnail) { return 418; }
        error_page 418 = @thumbnail;
        alias /var/www/wiring-static/;
        disable_symlinks on from=/var/www/wiring-static/;
    }
    location @thumbnail { proxy_pass http://rust:5082; }

    location ^~ /_wiring_uploads/ {
        internal;
        alias /state/uploads/;
        disable_symlinks on from=/state/uploads/;
    }
    location ^~ /_wiring_private_uploads/ {
        internal;
        alias /state/uploads/;
        disable_symlinks on from=/state/uploads/;
        add_header Cache-Control "private, max-age=86400";
    }
    location ^~ /_wiring_thumbs/ {
        internal;
        alias /state/thumbs/;
        disable_symlinks on from=/state/thumbs/;
    }
    location ^~ /_wiring_private_thumbs/ {
        internal;
        alias /state/thumbs/;
        disable_symlinks on from=/state/thumbs/;
        add_header Cache-Control "private, max-age=86400";
    }
    location ^~ /_wiring_static_files/ {
        internal;
        alias /var/www/wiring-static/;
        disable_symlinks on from=/var/www/wiring-static/;
    }
}
