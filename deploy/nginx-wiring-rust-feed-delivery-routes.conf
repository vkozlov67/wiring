location = /api/feed/view {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /api/feed/reset {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /api/deck/restart {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
