services:
  edge:
    volumes:
      - ./Caddyfile.oauth-start:/etc/caddy/Caddyfile:ro
  places:
    image: wiring-beta-places:public-oauth-start
    environment:
      WIRING_PUBLIC_OAUTH_START: "1"
      WIRING_GOOGLE_OAUTH_ENABLED: "1"
      WIRING_YANDEX_OAUTH_ENABLED: "1"
      WIRING_APPLE_OAUTH_ENABLED: "1"
      GOOGLE_CLIENT_ID: beta-synthetic-google
      YANDEX_CLIENT_ID: beta-synthetic-yandex
      APPLE_CLIENT_ID: beta-synthetic-apple
  flask:
    environment:
      GOOGLE_CLIENT_ID: beta-synthetic-google
      YANDEX_CLIENT_ID: beta-synthetic-yandex
      APPLE_CLIENT_ID: beta-synthetic-apple
      GOOGLE_CLIENT_SECRET: beta-placeholder
      YANDEX_CLIENT_SECRET: beta-placeholder
      APPLE_CLIENT_SECRET: beta-placeholder
