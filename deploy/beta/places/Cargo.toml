[package]
name = "wiring-beta-places"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
flate2 = "1"
form_urlencoded = "1"
getrandom = "0.4"
hmac = "0.13"
httpdate = "1"
memchr = "2"
minijinja = { version = "2", features = ["builtins", "json", "loader"] }
pbkdf2 = { version = "0.13", features = ["sha2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-postgres = "0.7"
unicode-normalization = "0.1"
subtle = "2"
