server {
    listen 188.166.105.108:443 ssl;
    server_name beta.wiring.club;

    ssl_certificate /etc/letsencrypt/live/beta.wiring.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.wiring.club/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/wiring-beta.access.log;
    error_log /var/log/nginx/wiring-beta.error.log;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 12m;

    location / {
        include /opt/wiring-beta/allowed-nginx.conf;
        deny all;

        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
