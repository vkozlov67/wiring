services:
  edge:
    volumes:
      - ./Caddyfile.mobile:/etc/caddy/Caddyfile:ro
  places:
    image: wiring-beta-places:public-mobile
    environment:
      WIRING_PUBLIC_MOBILE_SESSIONS: "1"
      APP_SECRET_KEY: ${BETA_SESSION_SECRET:?set a random beta session key}
      MOBILE_MIN_VERSION: "1.2.0"
