name: wiring-beta
services:
  edge:
    profiles: [standalone]
    image: caddy:2-alpine
    environment:
      BETA_SITE: ${BETA_SITE:-beta.wiring.club}
      BETA_ALLOWED_IPS: ${BETA_ALLOWED_IPS:?set tester IP addresses or CIDRs}
    ports:
      - "${BETA_BIND:-0.0.0.0}:${BETA_HTTP_PORT:-80}:80"
      - "${BETA_BIND:-0.0.0.0}:${BETA_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
    networks: [ingress, beta]
    depends_on:
      flask:
        condition: service_healthy
    restart: unless-stopped

  flask:
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile
      target: flask
    environment:
      DATABASE_URL: postgresql://wiring_beta:${BETA_DB_PASSWORD:?set a random beta database password}@postgres:5432/wiring_beta
      APP_SECRET_KEY: ${BETA_SESSION_SECRET:?set a random beta session key}
      SITE_URL: ${BETA_ORIGIN:-https://beta.wiring.club}
      SESSION_COOKIE_SECURE: ${BETA_SECURE_COOKIE:-1}
      GOOGLE_ANALYTICS_ID: ""
      YANDEX_METRIKA_ID: ""
      UPLOAD_DIR: /state/uploads
      THUMB_DIR: /state/thumbs
      BETA_PLACES_BACKEND: ${BETA_PLACES_BACKEND:-flask}
      WIRING_FEED_FILTER_URL: ${WIRING_FEED_FILTER_URL:-}
      WIRING_FEED_UPDATE_URL: ${WIRING_FEED_UPDATE_URL:-}
      WIRING_FEED_CLAIM_URL: ${WIRING_FEED_CLAIM_URL:-}
      WIRING_FEED_SWIPE_URL: ${WIRING_FEED_SWIPE_URL:-}
      WIRING_CHAT_THREAD_URL: ${WIRING_CHAT_THREAD_URL:-}
      WIRING_CHAT_SEND_URL: ${WIRING_CHAT_SEND_URL:-}
      WIRING_CHAT_MUTATE_URL: ${WIRING_CHAT_MUTATE_URL:-}
      WIRING_CHAT_HISTORY_URL: ${WIRING_CHAT_HISTORY_URL:-}
      WIRING_CHAT_MEDIA_URL: ${WIRING_CHAT_MEDIA_URL:-}
      WIRING_CHAT_PAIR_URL: ${WIRING_CHAT_PAIR_URL:-}
      WIRING_CHAT_TRANSCRIBE_URL: ${WIRING_CHAT_TRANSCRIBE_URL:-}
      WIRING_CHAT_INBOX_URL: ${WIRING_CHAT_INBOX_URL:-}
      WIRING_CHAT_MATCHES_URL: ${WIRING_CHAT_MATCHES_URL:-}
      WIRING_NOTICES_URL: ${WIRING_NOTICES_URL:-}
      WIRING_PASSWORD_URL: ${WIRING_PASSWORD_URL:-}
      WIRING_MOBILE_REFRESH_URL: ${WIRING_MOBILE_REFRESH_URL:-}
      WIRING_MOBILE_LOGOUT_URL: ${WIRING_MOBILE_LOGOUT_URL:-}
      WIRING_MOBILE_ISSUE_URL: ${WIRING_MOBILE_ISSUE_URL:-}
      WIRING_PROFILE_SETTINGS_URL: ${WIRING_PROFILE_SETTINGS_URL:-}
    volumes:
      - media:/state
    networks: [beta]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5070/api/catalog', timeout=3).close()"]
      interval: 3s
      timeout: 4s
      retries: 25
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wiring_beta
      POSTGRES_DB: wiring_beta
      POSTGRES_PASSWORD: ${BETA_DB_PASSWORD:?set a random beta database password}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [beta]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wiring_beta", "-d", "wiring_beta"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  places:
    profiles: [rust]
    build:
      context: ../..
      dockerfile: deploy/beta/Dockerfile
      target: places
    networks: [beta]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5081"]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped

networks:
  ingress:
  beta:
    internal: true

volumes:
  postgres:
  media:
  tls:
