location ~ ^/api/messages/[0-9]+/reaction$ {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}

location ~ ^/api/messages/[0-9]+$ {
    set $wiring_message_backend 127.0.0.1:5082;
    if ($request_method = PATCH) { set $wiring_message_backend 127.0.0.1:5082; }
    include /etc/nginx/snippets/wiring-rust-message-method-*.conf;
    proxy_pass http://$wiring_message_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
