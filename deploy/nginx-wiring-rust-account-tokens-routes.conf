location = /api/email/verify {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /api/password/reset {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /api/auth/native/exchange {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
