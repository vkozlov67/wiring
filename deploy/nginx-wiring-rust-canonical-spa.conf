location ~ ^/($|sign-in$|sign-up$|login$|register$|forgot$|reset$|verify$|feed$|for-you$|likes$|chats($|/[0-9]+$)|me($|/edit$)|consents$|plus$|premium$|onboard$|delete-account$|notifications$|archive$|p/[0-9]+$|r/[^/]+$) {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
