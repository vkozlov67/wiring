location = /api/push/public-key {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /api/push/subscribe {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location = /api/push/unsubscribe {
    include /etc/nginx/snippets/wiring-rust-public.conf;
    proxy_set_header X-Forwarded-For $remote_addr;
}
