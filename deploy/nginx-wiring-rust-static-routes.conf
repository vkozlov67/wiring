# Generated bundles and images are published from the same checkout as the web shell.
location = /sw.js {
    alias /var/www/wiring-static/sw.js;
    disable_symlinks on from=/var/www/wiring-static/;
    types { text/javascript js; }
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Keep the dynamic manifest on its exact-match Rust route and thumbnails on the existing handler.
location ~ ^/public/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*\.(?!js$)[A-Za-z0-9]+$ {
    if ($arg_s = sm) { return 418; }
    error_page 418 = @wiring_public_thumbnail;
    rewrite ^/public/(.*)$ /$1 break;
    root /var/www/wiring-static;
    disable_symlinks on from=/var/www/wiring-static/;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location ~ ^/public/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*\.js$ {
    if ($arg_s = sm) { return 418; }
    error_page 418 = @wiring_public_thumbnail;
    rewrite ^/public/(.*)$ /$1 break;
    root /var/www/wiring-static;
    types { text/javascript js; }
    disable_symlinks on from=/var/www/wiring-static/;
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location @wiring_public_thumbnail {
    set $wiring_static_thumbnail_backend 127.0.0.1:5082;
    include /etc/nginx/snippets/wiring-rust-static-thumbnail-backend*.conf;
    proxy_pass http://$wiring_static_thumbnail_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
