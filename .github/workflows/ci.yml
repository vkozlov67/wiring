name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      - name: Test frontend and the Rust HTTP API
        run: ./scripts/test.sh

      - name: Verify the local developer launch
        run: |
          trap './scripts/dev.sh stop' EXIT
          ./scripts/dev.sh
          curl -fsS http://127.0.0.1:5070/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"email":"dev@wiring.test","password":"wiring-dev"}' http://127.0.0.1:5070/api/login \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["user"]["email"] == "dev@wiring.test"'

      - name: Build the release used by production
        run: |
          deploy/build-rust-release.sh "$RUNNER_TEMP/release/rust"
          mkdir -p "$RUNNER_TEMP/release/frontend"
          cp -a public/dist/. "$RUNNER_TEMP/release/frontend/"
          tar -C "$RUNNER_TEMP/release" -czf "$RUNNER_TEMP/wiring-release.tar.gz" rust frontend

      - name: Save the tested release
        uses: actions/upload-artifact@v4
        with:
          name: wiring-release
          path: ${{ runner.temp }}/wiring-release.tar.gz
          if-no-files-found: error
          retention-days: 5

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wiring-release
          path: ${{ runner.temp }}

      - name: Unpack the tested release
        run: |
          mkdir -p "$RUNNER_TEMP/release" public/dist
          tar -xzf "$RUNNER_TEMP/wiring-release.tar.gz" -C "$RUNNER_TEMP/release"
          cp -a "$RUNNER_TEMP/release/frontend/." public/dist/

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Missing repository secret DEPLOY_SSH_KEY (private key for root@164.92.147.23)."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H -p "${{ vars.DEPLOY_SSH_PORT || 22 }}" "${{ vars.DEPLOY_HOST || '164.92.147.23' }}" >> ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          REMOTE_HOST: root@${{ vars.DEPLOY_HOST || '164.92.147.23' }}
          REMOTE_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: WIRING_RUST_RELEASE_DIR="$RUNNER_TEMP/release/rust" ./deploy.sh
